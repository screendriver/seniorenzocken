---
when:
    - event: pull_request
      evaluate: 'not (CI_COMMIT_SOURCE_BRANCH startsWith "renovate/" && CI_PIPELINE_AUTHOR == "renovate-bot")'
    - event: push
      branch: [main, renovate/**]
    - event: manual

labels:
    platform: linux/amd64

steps:
    - name: test
      image: node:26.12.1
      commands:
          - npm clean-install
          - npx just test
          - npx just generate-database-migrations

    - name: fail-on-git-status
      image: alpine/git:v2.54.1
      commands:
          - git status
          - test -z "$(git status --porcelain)"
